name: CPU tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cpu-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CUDA_VISIBLE_DEVICES: ""
      device: cpu
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      DIFFUSERS_OFFLINE: "1"
      HF_HUB_DISABLE_TELEMETRY: "1"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements/cpu-tests.txt
      - name: Install CPU test dependencies
        run: |
          python -m pip install torch==2.7.1+cpu torchvision==0.22.1+cpu --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements/cpu-tests.txt
          python -m pip check
      - name: Verify CPU-only PyTorch
        run: |
          python - <<'PY'
          import torch
          assert torch.version.cuda is None, "Expected a CPU-only PyTorch wheel"
          assert not torch.cuda.is_available()
          print(f"PyTorch {torch.__version__}; CUDA unavailable")
          PY
      - name: Run full test suite without network access
        run: python -m pytest -q --disable-socket tests
